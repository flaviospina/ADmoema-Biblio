<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 520" width="460" height="520">
  <!-- Brasão da Assembleia de Deus — Ministério do Belém (recriação vetorial) -->
  <defs>
    <linearGradient id="prata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8ea"/>
      <stop offset="1" stop-color="#c2c3c7"/>
    </linearGradient>
    <linearGradient id="lamina" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dadd"/>
      <stop offset=".5" stop-color="#9fa1a6"/>
      <stop offset="1" stop-color="#7c7e83"/>
    </linearGradient>
    <linearGradient id="chama1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d00"/>
      <stop offset="1" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="chama2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54d"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="fita" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b184"/>
      <stop offset="1" stop-color="#e69a66"/>
    </linearGradient>
    <clipPath id="clipEsq"><path d="M62 160 H230 V450 C160 448 96 414 70 350 C60 322 60 240 62 160 Z"/></clipPath>
  </defs>

  <!-- ===== chama ===== -->
  <g>
    <path fill="url(#chama1)" d="M230 18
      C258 52 282 74 282 106 C282 116 259 134 230 134 C201 134 178 116 178 106 C178 74 202 52 230 18 Z"/>
    <path fill="url(#chama2)" d="M230 58
      C246 80 258 94 258 112 C258 116 245 127 230 127 C215 127 202 116 202 112 C202 94 214 80 230 58 Z"/>
    <path fill="#fff3c0" d="M230 92 C238 103 243 110 243 119 C243 118 237 123 230 123 C223 123 217 118 217 119 C217 110 222 103 230 92 Z" opacity=".9"/>
  </g>
  <!-- base do tocheiro -->
  <rect x="212" y="128" width="36" height="10" rx="3" fill="#e0a23a" stroke="#8a6318" stroke-width="1.5"/>


  <!-- ===== escudo ===== -->
  <!-- metade direita (prata) -->
  <path d="M230 160 H398 C400 240 400 322 390 350 C364 414 300 448 230 450 Z"
        fill="url(#prata)" stroke="#26282c" stroke-width="4"/>
  <!-- metade esquerda: quartel superior preto -->
  <g clip-path="url(#clipEsq)">
    <rect x="55" y="150" width="180" height="155" fill="#17181c"/>
    <rect x="55" y="305" width="180" height="155" fill="#2196f3"/>
  </g>
  <path d="M62 160 H230 V450 C160 448 96 414 70 350 C60 322 60 240 62 160 Z"
        fill="none" stroke="#26282c" stroke-width="4"/>

  <!-- virol (barra verde/amarela) por cima do topo do escudo -->
  <g>
    <clipPath id="virolClip"><rect x="122" y="138" width="216" height="24" rx="12"/></clipPath>
    <rect x="122" y="138" width="216" height="24" rx="12" fill="#1e9e4a"/>
    <g clip-path="url(#virolClip)" fill="#ffd23f">
      <polygon points="146,138 176,138 154,162 124,162"/>
      <polygon points="204,138 234,138 212,162 182,162"/>
      <polygon points="262,138 292,138 270,162 240,162"/>
      <polygon points="320,138 350,138 328,162 298,162"/>
    </g>
    <rect x="122" y="138" width="216" height="24" rx="12" fill="none" stroke="#12281a" stroke-width="2.5"/>
  </g>

  <!-- pomba (quartel preto) -->
  <g fill="#ffffff" transform="translate(84,184) scale(.68)">
    <path d="M52 96 C40 68 56 40 92 34 C78 52 76 74 86 92 C74 92 61 93 52 96 Z"/>
    <path d="M84 92 C86 64 104 46 134 42 C120 56 116 76 120 92 C107 89 93 89 84 92 Z" fill-opacity=".92"/>
    <path d="M10 116 C28 100 62 92 92 96 C116 99 136 108 144 122 C136 134 120 140 104 138 C86 144 60 142 44 132 C52 140 64 145 78 146 C62 154 38 150 26 138 C18 131 12 124 10 116 Z"/>
    <path d="M138 120 C152 112 166 111 176 118 C166 122 159 128 155 137 C150 129 145 123 138 120 Z"/>
    <circle cx="9" cy="114" r="9"/>
    <path d="M0 110 L-14 115 L1 121 Z"/>
  </g>

  <!-- templo (quartel azul) -->
  <g transform="translate(105,318)">
    <g fill="#ffffff" stroke="#17181c" stroke-width="2">
      <rect x="28" y="6"  width="34" height="104"/>
      <rect x="0"  y="34" width="30" height="76"/>
      <rect x="60" y="26" width="26" height="84"/>
    </g>
    <g fill="#17181c">
      <rect x="33" y="14" width="24" height="5"/><rect x="33" y="26" width="24" height="5"/>
      <rect x="33" y="38" width="24" height="5"/><rect x="33" y="50" width="24" height="5"/>
      <rect x="33" y="62" width="24" height="5"/><rect x="33" y="74" width="24" height="5"/>
      <rect x="33" y="86" width="24" height="5"/>
      <rect x="5" y="42" width="20" height="4"/><rect x="5" y="52" width="20" height="4"/>
      <rect x="5" y="62" width="20" height="4"/><rect x="5" y="72" width="20" height="4"/>
      <rect x="5" y="82" width="20" height="4"/>
      <rect x="64" y="34" width="18" height="4"/><rect x="64" y="44" width="18" height="4"/>
      <rect x="64" y="54" width="18" height="4"/><rect x="64" y="64" width="18" height="4"/>
      <rect x="64" y="74" width="18" height="4"/>
    </g>
  </g>

  <!-- letras A D -->
  <g fill="#7e2430" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="72" text-anchor="middle">
    <text x="272" y="248">A</text>
    <text x="356" y="248">D</text>
  </g>

  <!-- espada (ponta para cima) -->
  <g>
    <path d="M314 172 L322 188 L322 330 H306 L306 188 Z" fill="url(#lamina)" stroke="#5c5e63" stroke-width="1.5"/>
    <line x1="314" y1="192" x2="314" y2="326" stroke="#f4f4f6" stroke-width="2" opacity=".8"/>
    <!-- laço dourado -->
    <path d="M314 330 C296 320 280 324 274 336 C286 336 296 340 302 348 C290 350 284 356 284 364 C296 358 306 356 314 358 C322 356 332 358 344 364 C344 356 338 350 326 348 C332 340 342 336 354 336 C348 324 332 320 314 330 Z"
          fill="#f2b52e" stroke="#8a6318" stroke-width="2"/>
    <!-- punho -->
    <rect x="306" y="356" width="16" height="44" rx="5" fill="#f2b52e" stroke="#8a6318" stroke-width="2"/>
    <g stroke="#8a6318" stroke-width="1.5">
      <line x1="306" y1="365" x2="322" y2="365"/>
      <line x1="306" y1="374" x2="322" y2="374"/>
      <line x1="306" y1="383" x2="322" y2="383"/>
      <line x1="306" y1="392" x2="322" y2="392"/>
    </g>
    <circle cx="314" cy="404" r="6" fill="#f2b52e" stroke="#8a6318" stroke-width="2"/>
  </g>

  <!-- ===== fita ===== -->
  <g>
    <!-- pontas -->
    <path d="M56 396 C40 402 30 416 32 434 L74 452 L86 414 Z" fill="url(#fita)" stroke="#a05c2c" stroke-width="2.5"/>
    <path d="M404 396 C420 402 430 416 428 434 L386 452 L374 414 Z" fill="url(#fita)" stroke="#a05c2c" stroke-width="2.5"/>
    <!-- faixa central curva -->
    <path d="M52 420 C120 470 340 470 408 420 L396 462 C330 506 130 506 64 462 Z"
          fill="url(#fita)" stroke="#a05c2c" stroke-width="2.5"/>
    <!-- texto na curva -->
    <path id="fitaCurva" d="M44 440 C136 500 324 500 416 440" fill="none"/>
    <text font-family="Arial, 'DejaVu Sans', sans-serif" font-weight="bold" font-size="17"
          fill="#1d2340" letter-spacing=".5">
      <textPath href="#fitaCurva" startOffset="50%" text-anchor="middle">MINISTÉRIO DO BELÉM • SÃO PAULO</textPath>
    </text>
  </g>
</svg>
