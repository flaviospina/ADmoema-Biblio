# Blueprint de deploy no Render (https://render.com)
# Publica o sistema Coral ADMoema como serviço web com HTTPS automático
# (necessário para o microfone funcionar na ferramenta de ensaio de voz).
services:
  - type: web
    name: coral-admoema
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true   # segredo de sessão gerado automaticamente pelo Render
